# Job "día nuevo": el mundo exterior sigue andando. Todas las mañanas, antes del lakehouse, genera los días que faltan
# hasta ayer (movimientos, compras con tarjeta, liquidaciones y saldos), los sube a Azure y actualiza el espejo del BCRA.
# Es parte de la simulación (como andes_fuentes), no del lakehouse.
resources:
  jobs:
    andes_dia:
      name: andes-bank-dia-nuevo
      description: Genera y publica en Azure cada día nuevo del banco simulado (hasta ayer)
      max_concurrent_runs: 1
      timeout_seconds: 7200
      # a las 5 (hora argentina): el lakehouse corre a las 7 y encuentra el día listo
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"
        timezone_id: America/Argentina/Buenos_Aires
        pause_status: UNPAUSED
      email_notifications:
        on_failure: ["${workspace.current_user.userName}"]
      tags:
        project: andes-bank
        layer: sources
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: scale_factor
          default: ${var.scale_factor}
        - name: start_date
          default: ${var.start_date}
        - name: end_date
          default: ayer
      tasks:
        - task_key: nuevo_dia
          max_retries: 1
          min_retry_interval_millis: 300000
          notebook_task:
            notebook_path: ../notebooks/06_new_day.py
        - task_key: fx_mirror
          max_retries: 2
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ../notebooks/04_fx_mirror.py
