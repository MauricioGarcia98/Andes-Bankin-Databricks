# Job "simular días": el mundo exterior avanza A PEDIDO. Se corre a mano cuando se quiere mostrar el pipeline con
# datos nuevos (no tiene horario: los días son simulados, no siguen el calendario real).
#
#   databricks bundle run andes_dia -t dev --params dias=3
#
# 1) nuevo_dia: simula N días (sim.*), los exporta sucios y los sube a Azure
# 2) fx_mirror: copia la serie real del BCRA al espejo
# 3) lakehouse: corre el job del lakehouse hasta el último día simulado
resources:
  jobs:
    andes_dia:
      name: andes-bank-dia-nuevo
      description: "Simula días nuevos del banco (parámetro dias), los publica en Azure y corre el lakehouse hasta ahí"
      max_concurrent_runs: 1
      timeout_seconds: 14400
      tags:
        project: andes-bank
        layer: sources
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: scale_factor
          default: ${var.scale_factor}
        - name: start_date
          default: ${var.start_date}
        - name: dias
          default: "1"
      tasks:
        - task_key: nuevo_dia
          max_retries: 1
          min_retry_interval_millis: 300000
          notebook_task:
            notebook_path: ../notebooks/06_new_day.py
        - task_key: fx_mirror
          depends_on: [{ task_key: nuevo_dia }]
          max_retries: 2
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ../notebooks/04_fx_mirror.py
            base_parameters:
              end_date: "{{tasks.nuevo_dia.values.ultimo_dia}}"
        - task_key: lakehouse
          depends_on: [{ task_key: fx_mirror }]
          run_job_task:
            job_id: ${resources.jobs.andes_lakehouse.id}
            job_parameters:
              end_date: "{{tasks.nuevo_dia.values.ultimo_dia}}"
