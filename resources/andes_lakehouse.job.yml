# Job principal del lakehouse: Azure/APIs → landing → bronze → silver → gold → quality gate.
# Compute serverless. Cada task es un notebook delgado que llama al paquete `andes_bank` (código testeado).
resources:
  jobs:
    andes_lakehouse:
      name: andes-bank-lakehouse
      description: "Pipeline medallion de Andes Bank: core (Blob), procesador de tarjetas y CRM (API), BCRA, gold y quality gate"
      max_concurrent_runs: 1
      timeout_seconds: 14400
      # corrida diaria a las 7 (hora argentina): todo es incremental (watermarks y Auto Loader), así que si no llegó
      # nada nuevo termina rápido; el quality gate igual vuelve a controlar gold
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"
        timezone_id: America/Argentina/Buenos_Aires
        pause_status: UNPAUSED
      email_notifications:
        on_failure: ["${workspace.current_user.userName}"]
      tags:
        project: andes-bank
        layer: all
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: scale_factor
          default: ${var.scale_factor}
        - name: start_date
          default: ${var.start_date}
        - name: end_date
          # hasta ayer: el job "día nuevo" (5 h) ya publicó el día anterior en Azure
          default: ayer
        - name: run_id
          default: "{{job.run_id}}"
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/00_setup.py
        # los archivos (Blob → Volume → Auto Loader) y las APIs corren en paralelo
        - task_key: landing_sync
          depends_on: [{ task_key: setup }]
          max_retries: 2
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ../notebooks/10_landing_sync.py
        - task_key: bronze_files
          depends_on: [{ task_key: landing_sync }]
          max_retries: 1
          notebook_task:
            notebook_path: ../notebooks/11_bronze_files.py
        - task_key: bronze_api
          depends_on: [{ task_key: setup }]
          # el cliente ya reintenta cada pedido; esto es para caídas de la API más largas (el watermark retoma)
          max_retries: 2
          min_retry_interval_millis: 300000
          notebook_task:
            notebook_path: ../notebooks/12_bronze_api.py
        - task_key: bronze_fx
          depends_on: [{ task_key: setup }]
          max_retries: 2
          min_retry_interval_millis: 120000
          notebook_task:
            notebook_path: ../notebooks/13_bronze_fx.py
        - task_key: bronze_crm
          depends_on: [{ task_key: setup }]
          max_retries: 2
          min_retry_interval_millis: 120000
          notebook_task:
            notebook_path: ../notebooks/14_bronze_crm.py
        - task_key: silver
          depends_on: [{ task_key: bronze_files }, { task_key: bronze_api }, { task_key: bronze_fx },
                       { task_key: bronze_crm }]
          notebook_task:
            notebook_path: ../notebooks/20_silver.py
        - task_key: gold
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ../notebooks/30_gold.py
        - task_key: governance_semantic
          depends_on: [{ task_key: gold }]
          notebook_task:
            notebook_path: ../notebooks/35_governance_semantic.py
        - task_key: quality_gate
          depends_on: [{ task_key: governance_semantic }]
          notebook_task:
            notebook_path: ../notebooks/40_quality_gate.py
