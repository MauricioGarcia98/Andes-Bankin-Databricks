# CI de Andes Bank: en cada PR, lint + tests rápidos + validación del bundle. Los tests con Spark (lentos) corren
# en main y a mano (workflow_dispatch).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-y-tests-rapidos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,azure]" requests
      - run: ruff check src tests azure scripts
      - run: pytest -m "not spark"

  tests-spark:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: pip install -e ".[dev,azure]" requests
      - run: pytest -m spark

  bundle-validate:
    runs-on: ubuntu-latest
    # necesita DATABRICKS_HOST y DATABRICKS_TOKEN como secrets del repo
    if: ${{ vars.DATABRICKS_CONFIGURED == 'true' }}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t dev
