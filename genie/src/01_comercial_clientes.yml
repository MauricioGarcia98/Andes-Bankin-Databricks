title: "Andes · Comercial y clientes"
domain: Comercial
description: >-
  Para la Gerencia de Banca Individual y Pymes: clientes, productos, cross-selling, saldos, actividad digital y
  plan sueldo, por segmento, región y sucursal.
users: "Lucía Ferreyra (Gerenta de Banca Individual) y los gerentes de sucursal"
tables:
  - gold.mart_cliente_360
  - gold.dim_cliente
  - gold.dim_cuenta
  - gold.dim_sucursal
  - gold.dim_cuenta_crm
  - gold.fact_oportunidad
  - gold.fact_caso
  - gold.mart_pipeline_comercial
metric_views:
  - semantic.mv_clientes
functions:
  - semantic.fn_resumen_cliente
instructions: |
  Sos el asistente Comercial de Andes Bank, un banco argentino regulado por el BCRA con sucursales en Cuyo, NOA y Centro.
  - "Clientes" = filas de gold.mart_cliente_360 (un cliente vigente por fila). "Personas" = COUNT(DISTINCT persona_id):
    por la fusión de 2008 hay personas con un número de cliente de Cuyo (CUY-) y otro del NOA (NOA-).
    Si preguntan "cuánta gente" o "personas", contá personas; si preguntan "clientes", contá clientes.
  - Para el estado actual de un cliente usá gold.dim_cliente con is_current = true. La historia (cambios de segmento) está en dim_cliente.
  - Segmentos: MASIVO, PLUS, PREMIUM, PYME. Regiones: CUYO, NOA, CENTRO, DIGITAL.
  - Montos en pesos sin decimales y con separador de miles. Si piden dólares usá las columnas *_usd.
  - Para la ficha de un cliente puntual usá fn_resumen_cliente('<cliente_id>').
  - DNI, CUIT, email y teléfono pueden salir enmascarados según los permisos del usuario: no es un error.
  - Cada usuario ve sólo las regiones que tiene asignadas (filtro de fila): si faltan regiones, es por permisos.
  - CRM comercial (desde jun-2024): oportunidades en gold.fact_oportunidad, reclamos y consultas en gold.fact_caso,
    cuentas del CRM en gold.dim_cuenta_crm. Se unen al core por persona_id. "Pipeline" = oportunidades abiertas
    (cerrada = false); "ganado" = ganada = true. Las cuentas duplicadas del CRM ya están unificadas en cuenta_principal_id:
    contá empresas con COUNT(DISTINCT cuenta_principal_id), nunca contando filas de dim_cuenta_crm.
  - metodo_match dice cómo se unió la cuenta del CRM al core (ID_CORE, CUIT o SIN_MATCH). Los prospectos no son clientes,
    pero SÍ son empresas cargadas en el CRM: "empresas en el CRM" los incluye.
  - "Clientes que son empresas" sale del core, no del CRM: gold.mart_cliente_360 con tipo_persona = 'JURIDICA'.
sample_questions:
  - "¿Cuántos clientes tenemos por segmento y región?"
  - "¿Qué sucursal tiene más clientes con tarjeta de crédito?"
  - "¿Cuántos clientes cobran el sueldo en el banco y no tienen tarjeta de crédito?"
  - "¿Qué porcentaje de los clientes PREMIUM opera por canales digitales?"
  - "¿Cuánto pipeline abierto hay por producto en el CRM?"
examples:
  - question: "Clientes y productos promedio por segmento"
    sql: |
      SELECT segmento, count(*) AS clientes, round(avg(cantidad_productos), 2) AS productos_promedio
      FROM ${catalog}.gold.mart_cliente_360 WHERE estado = 'ACTIVO' GROUP BY segmento ORDER BY clientes DESC
  - question: "Oportunidad de venta: cobran sueldo y no tienen tarjeta de crédito, por sucursal"
    sql: |
      SELECT sucursal, count(*) AS clientes
      FROM ${catalog}.gold.mart_cliente_360
      WHERE estado = 'ACTIVO' AND cobra_sueldo AND NOT tiene_tarjeta_credito
      GROUP BY sucursal ORDER BY clientes DESC
  - question: "Saldo total por región (metric view)"
    sql: |
      SELECT `Región`, round(MEASURE(`Saldo total (ARS)`), 0) AS saldo_ars
      FROM ${catalog}.semantic.mv_clientes GROUP BY ALL ORDER BY saldo_ars DESC
  - question: "¿Cuántas personas tienen dos números de cliente?"
    sql: |
      SELECT count(DISTINCT persona_id) FROM ${catalog}.gold.dim_cliente
      WHERE is_current AND regla_identidad = 'DNI+NOMBRE'
  - question: "Pipeline abierto por producto"
    sql: |
      SELECT producto, count(*) AS oportunidades, round(sum(monto_ars), 0) AS pipeline_ars
      FROM ${catalog}.gold.fact_oportunidad WHERE NOT cerrada GROUP BY producto ORDER BY pipeline_ars DESC NULLS LAST
  - question: "¿Qué porcentaje de las cuentas de clientes del CRM no se pudo unir al core?"
    sql: |
      SELECT round(100 * avg(CASE WHEN metodo_match = 'SIN_MATCH' THEN 1 ELSE 0 END), 1) AS pct_sin_match
      FROM ${catalog}.gold.dim_cuenta_crm WHERE tipo != 'Prospect' AND NOT es_duplicada
benchmarks:
- q: ¿Cuántas oportunidades abiertas hay en el CRM?
  sql: SELECT count(*) FROM ${catalog}.gold.fact_oportunidad WHERE NOT cerrada
- q: ¿Qué producto tiene más oportunidades ganadas?
  sql: SELECT producto FROM ${catalog}.gold.fact_oportunidad WHERE ganada GROUP BY producto ORDER BY count(*) DESC LIMIT 1
- q: ¿Cuántos casos abiertos hay en el CRM?
  sql: SELECT count(*) FROM ${catalog}.gold.fact_caso WHERE NOT cerrado
- q: ¿Cuántas empresas distintas hay cargadas en el CRM?
  sql: SELECT count(DISTINCT cuenta_principal_id) FROM ${catalog}.gold.dim_cuenta_crm
- q: ¿Cuántos clientes vigentes tenemos?
  sql: SELECT count(*) FROM ${catalog}.gold.mart_cliente_360
- q: ¿Cuántos clientes activos hay en el segmento PREMIUM?
  sql: SELECT count(*) FROM ${catalog}.gold.mart_cliente_360 WHERE segmento = 'PREMIUM' AND estado = 'ACTIVO'
- q: ¿Cuántas personas distintas son clientes?
  sql: SELECT count(DISTINCT persona_id) FROM ${catalog}.gold.mart_cliente_360
- q: ¿Qué región tiene más clientes?
  sql: SELECT region FROM ${catalog}.gold.mart_cliente_360 GROUP BY region ORDER BY count(*) DESC LIMIT 1
- q: ¿Cuántos clientes tienen tarjeta de crédito?
  sql: SELECT count(*) FROM ${catalog}.gold.mart_cliente_360 WHERE tiene_tarjeta_credito
- q: ¿Qué porcentaje de los clientes tiene caja de ahorro en dólares?
  sql: SELECT round(avg(CASE WHEN tiene_caja_usd THEN 1.0 ELSE 0 END) * 100, 1) FROM ${catalog}.gold.mart_cliente_360
- q: ¿Cuántos productos tiene en promedio un cliente PYME?
  sql: SELECT round(avg(cantidad_productos), 2) FROM ${catalog}.gold.mart_cliente_360 WHERE segmento = 'PYME'
- q: ¿Cuántos clientes cobran el sueldo en el banco y no tienen tarjeta de crédito?
  sql: SELECT count(*) FROM ${catalog}.gold.mart_cliente_360 WHERE cobra_sueldo AND NOT tiene_tarjeta_credito AND estado = 'ACTIVO'
- q: ¿Qué sucursal física tiene más clientes?
  sql: SELECT sucursal FROM ${catalog}.gold.mart_cliente_360 WHERE sucursal_id <> 999 GROUP BY sucursal ORDER BY count(*) DESC LIMIT 1
- q: ¿Cuántos clientes son 100% digitales?
  sql: SELECT count(*) FROM ${catalog}.gold.mart_cliente_360 WHERE region = 'DIGITAL'
- q: ¿Cuántos clientes dieron de baja su relación con el banco?
  sql: SELECT count(*) FROM ${catalog}.gold.mart_cliente_360 WHERE estado = 'BAJA'
- q: ¿Cuántas personas tienen dos números de cliente por la fusión con el banco del NOA?
  sql: SELECT count(DISTINCT persona_id) FROM ${catalog}.gold.dim_cliente WHERE is_current AND regla_identidad = 'DNI+NOMBRE'
- q: Saldo total en pesos de los clientes de la región NOA
  sql: SELECT round(sum(saldo_total_ars), 0) FROM ${catalog}.gold.mart_cliente_360 WHERE region = 'NOA'
- q: ¿Cuántos clientes cambiaron de segmento alguna vez?
  sql: SELECT count(DISTINCT cliente_id) FROM (SELECT cliente_id, count(DISTINCT segmento) AS s FROM ${catalog}.gold.dim_cliente GROUP BY cliente_id) WHERE s > 1
- q: Porcentaje digital promedio de los clientes PREMIUM
  sql: SELECT round(avg(porcentaje_digital_90d), 1) FROM ${catalog}.gold.mart_cliente_360 WHERE segmento = 'PREMIUM'
- q: ¿Cuántos clientes son empresas?
  sql: SELECT count(*) FROM ${catalog}.gold.mart_cliente_360 WHERE tipo_persona = 'JURIDICA'
